  <!-- RIGHT: Incoming Qualified Calls & Booked Appointments Stack -->
  <g transform="translate(436, 98)" filter="url(#lSh)">
    <!-- Card 1: Verified Phone Call -->
    <rect width="328" height="92" rx="18" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
    <circle cx="44" cy="46" r="24" fill="#DCFCE7"/>
    <text x="33" y="54" font-size="22">📞</text>
    <text x="82" y="34" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">203 Qualified Phone Calls</text>
    <text x="82" y="53" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#475569">Tracked via CallRail DNI to exact keyword</text>
    <text x="82" y="72" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#16A34A">● HOME SERVICES · 30-DAY VERIFIED</text>

    <!-- Card 2: Booked Consultation Form -->
    <g transform="translate(0, 110)">
      <rect width="328" height="92" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="44" cy="46" r="24" fill="#DBEAFE"/>
      <text x="33" y="54" font-size="22">📅</text>
      <text x="82" y="34" font-family="Sora, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F172A">20.42% Peak Conv. Rate</text>
      <text x="82" y="53" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#475569">303 high-intent bookings in 7-day sprint</text>
      <text x="82" y="72" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#1F74F0">● LAW · ROOFING · CLINICS · LOCAL</text>
    </g>

    <!-- Card 3: CPA Drop Summary Banner -->
    <g transform="translate(0, 220)">
      <rect width="328" height="94" rx="18" fill="#0F172A" stroke="rgba(74,222,128,0.45)" stroke-width="1.5"/>
      <text x="22" y="32" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="700" fill="#93C5FD">VERIFIED CPA REDUCTION</text>
      <text x="22" y="68" font-family="Sora, Arial, sans-serif" font-size="26" font-weight="800" fill="#4ADE80">-67% CPA</text>
      <text x="172" y="52" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#FCA5A5" text-decoration="line-through">$83.88 / lead</text>
      <text x="172" y="71" font-family="Sora, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">→ $27.87 / lead</text>
    </g>
  </g>
</svg>
